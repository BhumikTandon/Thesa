<!DOCTYPE html>
<html>
<head>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YnJhdmUtY291Z2FyLTUwLmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
</head>
<body>
  <div id="step1">
    <input id="email" placeholder="email" " /><br>
    <input id="password" type="password" placeholder="password" /><br>
    <button id="signin">Sign In</button>
  </div>
  <div id="step2" style="display:none">
    <p>Check your email for a code:</p>
    <input id="code" placeholder="6-digit code" /><br>
    <button id="verify">Verify</button>
  </div>
  <pre id="output" style="word-wrap:break-word; white-space:pre-wrap;"></pre>

  <script>
    let signInAttempt;
    window.addEventListener('load', async function () {
      await window.Clerk.load();

      if (window.Clerk.session) {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('output').innerText = await window.Clerk.session.getToken({ skipCache: true });
        const refreshBtn = document.createElement('button');
        refreshBtn.innerText = 'Get Fresh Token';
        refreshBtn.onclick = async () => {
          document.getElementById('output').innerText = await window.Clerk.session.getToken({ skipCache: true });
        };
        document.body.appendChild(refreshBtn);
        return;
      }

      document.getElementById('signin').addEventListener('click', async function() {
        try {
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          signInAttempt = await window.Clerk.client.signIn.create({ identifier: email, password: password });

          if (signInAttempt.status === 'complete') {
            await window.Clerk.setActive({ session: signInAttempt.createdSessionId });
            document.getElementById('output').innerText = await window.Clerk.session.getToken({ skipCache: true });
          } else if (signInAttempt.status === 'needs_client_trust' || signInAttempt.status === 'needs_second_factor') {
            await signInAttempt.prepareSecondFactor({ strategy: 'email_code' });
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
          } else {
            document.getElementById('output').innerText = JSON.stringify(signInAttempt, null, 2);
          }
        } catch (err) {
          document.getElementById('output').innerText = 'Error: ' + err.message;
        }
      });

      document.getElementById('verify').addEventListener('click', async function() {
        try {
          const code = document.getElementById('code').value;
          const result = await signInAttempt.attemptSecondFactor({ strategy: 'email_code', code: code });
          if (result.status === 'complete') {
            await window.Clerk.setActive({ session: result.createdSessionId });
            document.getElementById('output').innerText = await window.Clerk.session.getToken({ skipCache: true });
          } else {
            document.getElementById('output').innerText = JSON.stringify(result, null, 2);
          }
        } catch (err) {
          document.getElementById('output').innerText = 'Error: ' + err.message;
        }
      });
    });
  </script>
</body>
</html>
